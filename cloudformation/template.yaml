AWSTemplateFormatVersion: '2010-09-09'

Parameters:
  ImageUri:
    Type: String

Resources:

  HelloLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: hello-lambda-container
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Role: arn:aws:iam::231229084429:role/service-role/hello-lambda-container-role-kvisr6sc
      MemorySize: 128
      Timeout: 30
      Environment:
        Variables:
          STEP_FUNCTION_1_ARN: !Ref DemoWorkflow1
          STEP_FUNCTION_2_ARN: !Ref DemoWorkflow2

  DemoWorkflow1:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: DemoWorkflow1
      RoleArn: arn:aws:iam::231229084429:role/StepFunctionExecutionRole
      DefinitionString: |
        {
          "Comment": "Workflow 1",
          "StartAt": "Success",
          "States": {
            "Success": {
              "Type": "Succeed"
            }
          }
        }

  DemoWorkflow2:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: DemoWorkflow2
      RoleArn: arn:aws:iam::231229084429:role/StepFunctionExecutionRole
      DefinitionString: |
        {
          "Comment": "Workflow 2",
          "StartAt": "Success",
          "States": {
            "Success": {
              "Type": "Succeed"
            }
          }
        }

Outputs:

  LambdaName:
    Value: !Ref HelloLambda

  StepFunction1Arn:
    Value: !Ref DemoWorkflow1

  StepFunction2Arn:
    Value: !Ref DemoWorkflow2