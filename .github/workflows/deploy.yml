name: Build Lambda

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Package
        run: |
          zip lambda.zip lambda_function.py

      - name: Upload package to Octopus
        run: |
          VERSION="1.0.${{ github.run_number }}"

          curl -X POST \
            "${{ secrets.OCTOPUS_SERVER }}/api/${{ secrets.OCTOPUS_SPACE_ID }}/packages/raw?replace=true" \
            -H "X-Octopus-ApiKey: ${{ secrets.OCTOPUS_API_KEY }}" \
            -F "data=@lambda.zip"
