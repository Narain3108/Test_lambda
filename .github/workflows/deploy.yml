name: Build Lambda

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Package
        run: |
          VERSION="1.0.${{ github.run_number }}"
          PACKAGE_NAME="hello-lambda.${VERSION}.zip"
      
          zip "${PACKAGE_NAME}" lambda_function.py
      
          echo "PACKAGE_NAME=${PACKAGE_NAME}" >> $GITHUB_ENV
      
      - name: Upload package to Octopus
        run: |
          echo "Uploading ${PACKAGE_NAME}"
      
          curl -X POST \
            "${{ secrets.OCTOPUS_SERVER }}/api/Spaces-1/packages/raw?replace=true" \
            -H "X-Octopus-ApiKey: ${{ secrets.OCTOPUS_API_KEY }}" \
            -F "data=@${PACKAGE_NAME}"
